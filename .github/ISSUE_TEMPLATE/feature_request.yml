name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Droid Mobile only uses public interfaces: the Apache-2.0 `@factory/droid-sdk` and your own
        `droid daemon`. Ideas that need a private Factory API, a relay server or Factory sign-in
        cannot be accepted (see docs/tos.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do from your phone that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it work? Sketches and links to the desktop behaviour you want to match help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked docs/limitations.md and the existing issues.
          required: true
        - label: I am willing to test a build or help implement this.
