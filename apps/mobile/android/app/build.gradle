apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// One source of truth: the web layer shows the same apps/mobile/package.json version.
def appPackageVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version

// Release signing material lives outside the tree that is committed: secrets/ is git-ignored.
// DROID_KEYSTORE_PROPERTIES overrides the location. Relative storeFile values resolve against
// the properties file. Created by tools/dev/new-release-keystore.ps1.
def keystorePropsFile = System.getenv('DROID_KEYSTORE_PROPERTIES')
        ? new File(System.getenv('DROID_KEYSTORE_PROPERTIES'))
        : rootProject.file('../../../secrets/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.isFile()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.droidmobile.client"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.droidmobile.client"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName appPackageVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.isFile()) {
                storeFile new File(keystorePropsFile.parentFile, keystoreProps['storeFile'] as String)
                storePassword keystoreProps['storePassword'] as String
                keyAlias keystoreProps['keyAlias'] as String
                keyPassword keystoreProps['keyPassword'] as String
                // v1 is dropped automatically at minSdk 24; v3 is opt-in in AGP.
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// A release artifact must never silently come out unsigned or debug-signed.
gradle.taskGraph.whenReady { graph ->
    def packagesRelease = graph.allTasks.any {
        it.project == project && it.name =~ /^(assemble|bundle|package)Release$/
    }
    if (packagesRelease && !keystorePropsFile.isFile()) {
        throw new GradleException(
            "Release signing config not found: ${keystorePropsFile}. " +
            "Run tools/dev/new-release-keystore.ps1 once (see docs/release.md).")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
